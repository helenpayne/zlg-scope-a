name: netprobe
on: workflow_dispatch
concurrency: {group: netprobe, cancel-in-progress: false}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        leg: [0,1]
    steps:
      - name: env
        run: echo "egress: $(curl -s --max-time 10 ifconfig.me || echo n/a)"
      - name: install
        run: |
          npm install -g opencode-ai @kilocode/cli 2>&1 | tail -2
          opencode --version 2>&1 | head -1
          kilo --version 2>&1 | tail -1
      - name: kilo-text
        run: |
          timeout 120 kilo run -m kilo/kilo-auto/free --title x \
            "只回复两个字:ok" > /tmp/kt.out 2>&1; echo "kilo-text exit=$?"
          tail -10 /tmp/kt.out
      - name: kilo-vision
        run: |
          curl -sL --max-time 30 -o /tmp/t.jpg -A "Mozilla/5.0" \
            "https://cdn.wangwang.life/uploads/user/20261025/20261025112855166f08021_img.jpg"; \
            file /tmp/t.jpg | head -1
          timeout 150 kilo run -m kilo/nvidia/nemotron-3.5-super-vl:free \
            -f /tmp/t.jpg --title x "图中有什么?一句话" > /tmp/kv.out 2>&1; echo "kilo-img exit=$?"
          tail -12 /tmp/kv.out
      - name: opencode-text
        if: always()
        run: |
          timeout 120 opencode run -m opencode/mimo-v2.6-flash-free --title x \
            "只回复两个字:ok" > /tmp/ot.out 2>&1; echo "oc-text exit=$?"
          tail -8 /tmp/ot.out
      - name: opencode-vision
        if: always()
        run: |
          timeout 150 opencode run -m opencode/deepseek-v4.1-flash-free -f /tmp/t.jpg \
            --title x "图中有什么?一句话" > /tmp/ov.out 2>&1; echo "oc-img exit=$?"
          tail -8 /tmp/ov.out
