name: pipeline
on:
  workflow_dispatch:
    inputs:
      issue:
        description: '期号, 如 273 或 2026273'
        required: false
        default: ''
      aid:
        description: '文章ID(优先级高于issue, 用于精确锁定综合参考区文章)'
        required: false
        default: '0'
      shards:
        description: '分片数'
        required: false
        default: '8'
      max_per_shard:
        description: '每分片最多处理图数(0=不限)'
        required: false
        default: '0'
      all:
        description: '1=忽略已处理状态(演练/重跑)'
        required: false
        default: '0'
  schedule:
    # 自动消化待 OCR 追加图: 北京 12:00-23:50 (UTC 04:00-15:50), 每10分钟
    - cron: '*/10 4-15 * * *'

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.gen.outputs.shards }}
    env:
      N: ${{ inputs.shards || '8' }}
    steps:
      - id: gen
        run: |
          echo "shards=$(seq 0 $((N-1)) | jq -c -R 'tonumber' | jq -sc .)" >> "$GITHUB_OUTPUT"

  work:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shards) }}
    env:
      ISSUE: ${{ inputs.issue || '' }}
      AID: ${{ inputs.aid || '0' }}
      N: ${{ inputs.shards || '8' }}
      MAXN: ${{ inputs.max_per_shard || '0' }}
      ALL: ${{ inputs.all || '0' }}
    steps:
      - uses: actions/checkout@v4
      - name: setup
        run: |
          npm install -g opencode-ai 2>&1 | tail -1
          node --version; opencode --version 2>&1 | head -1

      - name: pull manifest
        env:
          API_BASE: ${{ secrets.API_BASE }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: |
          SHARD="${{ matrix.shard }}/$N"
          curl -fsSL -H "X-GA-Token: $API_TOKEN" \
            "$API_BASE/api/ga/tasks?issue=$ISSUE&aid=$AID&shard=$SHARD&limit=500&all=$ALL" \
            -o manifest.json
          python3 -c "import json; d=json.load(open('manifest.json')); print('shard',d['shard'],'items',d['count'])"

      - name: process images
        env:
          API_BASE: ${{ secrets.API_BASE }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: |
          python3 .github/scripts/ga_worker.py

      - name: done
        if: always()
        run: cat work/report.json 2>/dev/null || echo no-report
