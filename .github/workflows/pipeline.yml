name: pipeline
on:
  workflow_dispatch:
    inputs:
      issue:
        description: '期号, 如 273 或 2026273'
        required: false
        default: ''
      aid:
        description: '文章ID(优先级高于issue, 用于精确锁定综合参考区文章)'
        required: false
        default: '0'
      shards:
        description: '分片数(0=按待处理量自动)'
        required: false
        default: '0'
      max_per_shard:
        description: '每分片最多处理图数(0=不限)'
        required: false
        default: '0'
      img_concurrency:
        description: '单worker内并发的图数(默认3)'
        required: false
        default: '3'
      all:
        description: '1=忽略已处理状态(演练/重跑)'
        required: false
        default: '0'
# schedule 已停用: 改由本机 cron 经 workflow_dispatch 驱动(collector/ga_trigger.sh)。

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.gen.outputs.shards }}
      n: ${{ steps.gen.outputs.n }}
    steps:
      - id: gen
        env:
          API_BASE: ${{ secrets.API_BASE }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          ISSUE: ${{ inputs.issue || '' }}
          AID: ${{ inputs.aid || '0' }}
          FORCE: ${{ inputs.shards || '0' }}
          PER_SHARD: '40'
          MAX_SHARDS: '16'
        run: |
          N="$FORCE"
          if [ "$N" = "0" ]; then
            P=$(curl -fsS -H "X-GA-Token: $API_TOKEN" \
                 "$API_BASE/api/ga/pending?issue=$ISSUE&aid=$AID" \
                 | python3 -c "import sys,json;print(json.load(sys.stdin)['pending'])" \
                 || echo 0)
            N=$(python3 -c "import math;p=int('$P');print(max(1,min($MAX_SHARDS,math.ceil(p/$PER_SHARD))))")
            echo "pending=$P -> shards=$N"
          fi
          echo "n=$N" >> "$GITHUB_OUTPUT"
          echo "shards=$(seq 0 $((N-1)) | jq -c -R 'tonumber' | jq -sc .)" >> "$GITHUB_OUTPUT"

  work:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shards) }}
    env:
      ISSUE: ${{ inputs.issue || '' }}
      AID: ${{ inputs.aid || '0' }}
      N: ${{ needs.prepare.outputs.n }}
      MAXN: ${{ inputs.max_per_shard || '0' }}
      ALL: ${{ inputs.all || '0' }}
      BUDGET_SEC: '1500'
      IMG_CONCURRENCY: ${{ inputs.img_concurrency || '3' }}
    steps:
      - uses: actions/checkout@v4
      - name: setup
        run: |
          npm install -g opencode-ai 2>&1 | tail -1
          node --version; opencode --version 2>&1 | head -1

      - name: pull manifest
        env:
          API_BASE: ${{ secrets.API_BASE }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: |
          SHARD="${{ matrix.shard }}/$N"
          curl -fsSL -H "X-GA-Token: $API_TOKEN" \
            "$API_BASE/api/ga/tasks?issue=$ISSUE&aid=$AID&shard=$SHARD&limit=500&all=$ALL" \
            -o manifest.json
          python3 -c "import json; d=json.load(open('manifest.json')); print('shard',d['shard'],'items',d['count'])"

      - name: process images
        env:
          API_BASE: ${{ secrets.API_BASE }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: |
          python3 .github/scripts/ga_worker.py

      - name: done
        if: always()
        run: cat work/report.json 2>/dev/null || echo no-report
