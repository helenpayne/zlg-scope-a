name: smoke-test
on:
  push:
    paths: ['.github/workflows/smoke.yml', 'work/t1.url.txt']
  workflow_dispatch:
    inputs:
      img_url:
        description: 'test image url'
        required: true
      model:
        description: 'cline model'
        required: false
        default: 'cline-free/mimo-v2.6-flash'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: env probe
        run: |
          echo "ip: $(curl -s ifconfig.me || echo n/a)"
          node --version; npm --version; python3 --version

      - name: download test image
        run: |
          URL="${{ inputs.img_url }}"
          [ -z "$URL" ] && URL=$(head -1 work/t1.url.txt)
          echo "::add-mask::$URL"
          mkdir -p work
          echo "--- 裸curl ---"
          curl -s -o /dev/null -w "code=%{http_code} ip=%{remote_ip} time=%{time_total}\n" --max-time 30 "$URL" || echo "curl failed rc=$?"
          echo "--- 带UA+Referer ---"
          curl -s -o /dev/null -w "code=%{http_code} time=%{time_total}\n" --max-time 30 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36" \
            -e "https://www.zlg3d.com/" "$URL" || echo "curl failed rc=$?"
          echo "--- DNS ---"
          getent hosts cdn.wangwang.life | head -3
          curl -fsSL -o work/t1.jpg --max-time 60 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36" \
            -e "https://www.zlg3d.com/" "$URL" && ls -la work/

      - name: install cline
        run: npm install -g cline 2>&1 | tail -3

      - name: vision extract
        env:
          CLINE_NO_AUTO_UPDATE: "1"
        run: |
          cd work
          time timeout 180 cline -m "${{ inputs.model }}" \
            --thinking none --compaction off -c . \
            -s "你是数据提取器。直接读图输出,禁止使用工具做二次验证,不要写文件" \
            "读取当前目录下 t1.jpg 图片,逐行提取图中全部文字行,每行原样输出到JSON数组。只输出JSON。"
