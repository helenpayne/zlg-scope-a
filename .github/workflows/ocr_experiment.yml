name: vision-experiment

# 实验: 5 个 runner 并行, 各拉一段"追加料图"URL -> 下载 -> 图片直接交大模型判 直选/色彩吧/垃圾 -> CSV
# (不再使用 OCR; runner 内 VISION_CONCURRENCY 个 opencode 窗口并行)
on:
  workflow_dispatch:
    inputs:
      aid:
        description: 文章ID
        default: '2663478'
      start:
        description: 起始序号(1-based)
        default: '1'
      end:
        description: 结束序号(含)
        default: '100'
      shards:
        description: 并行 runner 数
        default: '5'
      vision_concurrency:
        description: 每个runner内 opencode 并行窗口数
        default: '5'
      vision_models:
        description: 投票模型(逗号分隔, 每个元素=一票; 平票时靠后者优先)
        default: 'opencode/space-bunny-free,opencode/space-bunny-free,opencode/mimo-v2.6-flash-free'
      force:
        description: '1=忽略数据库全部重跑(调试); 0=只处理新图(默认)'
        default: '0'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          n = int("${{ inputs.shards }}")
          print("matrix=" + json.dumps(list(range(n))))
          PY

  shard:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      API_BASE: ${{ secrets.API_BASE }}
      API_TOKEN: ${{ secrets.API_TOKEN }}
      AID: ${{ inputs.aid }}
      START: ${{ inputs.start }}
      END: ${{ inputs.end }}
      SHARD: ${{ matrix.shard }}
      SHARDS: ${{ inputs.shards }}
      VISION_CONCURRENCY: ${{ inputs.vision_concurrency }}
      VISION_MODELS: ${{ inputs.vision_models }}
      FORCE: ${{ inputs.force }}
      OUT_DIR: out
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: deps
        run: |
          npm install -g opencode-ai 2>&1 | tail -1
          opencode --version 2>&1 | head -1
      - name: run shard
        run: python .github/scripts/vision_shard.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-${{ matrix.shard }}
          path: out/

  combine:
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: all
          merge-multiple: true
      - name: merge (子目录存图 + CSV 数据库追加)
        env:
          AID: ${{ inputs.aid }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          API_BASE: ${{ secrets.API_BASE }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: |
          # 图片: 按文章子目录存放, 采用"合并"策略(不删除), 避免局部/空跑把范围外或已有图片抹掉
          mkdir -p "experiments/images/${AID}"
          cp -n all/images/* "experiments/images/${AID}/" 2>/dev/null || true
          python3 - <<'PY'
          import csv, glob, json, os, re
          from collections import defaultdict
          aid = os.environ["AID"]
          FIELDS = ["idx","sha256","url","name","kind","junk","content",
                    "author","reason","votes","model","sec","status"]
          db = f"experiments/vision_{aid}.csv"           # 该文章的持久数据库
          rows = {}
          for f in glob.glob(f"experiments/vision_{aid}*.csv"):
              with open(f, newline="", encoding="utf-8") as fh:
                  for r in csv.DictReader(fh):
                      if r.get("sha256"):
                          rows[r["sha256"]] = r
          new = 0
          for f in sorted(glob.glob("all/shard_*.csv")):
              with open(f, newline="", encoding="utf-8") as fh:
                  for r in csv.DictReader(fh):
                      if r.get("sha256"):
                          rows[r["sha256"]] = r; new += 1
          out = sorted(rows.values(), key=lambda r: int(r["idx"]))
          # --- 作者白名单: 与『色彩吧』同图共现的作者 + 『色彩吧』本身 (永久, 不计入/不命中垃圾库) ---
          whitelist = {"色彩吧"}
          for f in glob.glob("experiments/author_whitelist*.txt"):
              for x in open(f, encoding="utf-8").read().splitlines():
                  if x.strip(): whitelist.add(x.strip())
          def has_scb(r):
              return r.get("kind") == "色彩吧"
          wl_added = set()
          for r in out:
              a = (r.get("author") or "").strip()
              if a and has_scb(r) and a not in whitelist:
                  whitelist.add(a); wl_added.add(a)
          # --- 垃圾作者库: 原始判定为垃圾的行的作者 (过滤平台水印/类别词/白名单作者) ---
          WM = ("料阁", "料閣", "料图", "料図", "臻料")
          NON_AUTHOR = {"色彩吧", "3D直选", "P3直选", "垃圾", "3D", "P3", "直选"}
          def is_wm(n):
              n = (n or "").replace(" ", "")
              return n in NON_AUTHOR or any(w in n for w in WM)
          authors = set()
          for f in glob.glob("experiments/junk_authors*.txt"):
              for x in open(f, encoding="utf-8").read().splitlines():
                  x = x.strip()
                  if x and not is_wm(x) and x not in whitelist:
                      authors.add(x)
          added = set()
          for r in out:
              a = (r.get("author") or "").strip()
              if r.get("kind") == "垃圾" and a and not is_wm(a) and a not in whitelist and a not in authors:
                  authors.add(a); added.add(a)
          # --- 用当轮最终库+白名单统一裁决(消除"旧库滞后"): 命中垃圾作者库且非色彩吧 -> 垃圾 ---
          hitn = 0
          for r in out:
              a = (r.get("author") or "").strip()
              if r.get("kind") != "色彩吧" and a and a in authors and not is_wm(a):
                  r["kind"] = "垃圾"; r["junk"] = "true"; r["content"] = ""
                  if not (r.get("reason") or "").startswith("作者库命中"):
                      r["reason"] = f"作者库命中[{a}]: {r.get('reason','')}"[:80]
                  hitn += 1
          with open(db, "w", newline="", encoding="utf-8") as fh:
              w = csv.DictWriter(fh, fieldnames=FIELDS, restval="", extrasaction="ignore")
              w.writeheader(); w.writerows(out)
          # 派生"整批垃圾"来源黑名单: 同一上传秒(ts)内 >=2 张且全为垃圾
          def ts(u):
              m = re.search(r"/(\d{14})", u or ""); return m.group(1) if m else ""
          grp = defaultdict(list)
          for r in out:
              if ts(r["url"]): grp[ts(r["url"])].append(r)
          skip = set()
          for k, v in grp.items():
              if len(v) >= 2 and all(x.get("kind") == "垃圾" for x in v):
                  skip.add(k)
          with open(f"experiments/{aid}.skip", "w", encoding="utf-8") as fh:
              fh.write("\n".join(sorted(skip)) + ("\n" if skip else ""))
          with open("experiments/author_whitelist.txt", "w", encoding="utf-8") as fh:
              fh.write("\n".join(sorted(whitelist)) + "\n")
          with open("experiments/junk_authors.txt", "w", encoding="utf-8") as fh:
              fh.write("\n".join(sorted(authors)) + ("\n" if authors else ""))
          k = defaultdict(int)
          for r in out: k[r["kind"]] += 1
          print(f"{db}: 共 {len(out)} 张(本次新增 {new}), kind={dict(k)}, 整批垃圾来源={len(skip)}, 库命中={hitn}")
          print(f"垃圾作者库: 共 {len(authors)} 个(本次新增 {sorted(added)})")
          print(f"作者白名单: 共 {len(whitelist)} 个(本次新增 {sorted(wl_added)})")
          # 自动入库: 色彩吧行 -> ga_api -> MySQL fact_scb_vision (按文章先清后插)
          api = (os.environ.get("API_BASE") or "").rstrip("/")
          tok = os.environ.get("API_TOKEN") or ""
          scb = [{"sha256": r["sha256"], "article_id": int(aid),
                  "idx": int(r["idx"]), "url": r.get("url") or "",
                  "author": r.get("author") or "", "content": r.get("content") or "",
                  "kind": r.get("kind") or ""}
                 for r in out if r.get("kind") == "色彩吧" and r.get("sha256")]
          if api and tok:
              import urllib.request
              req = urllib.request.Request(
                  f"{api}/api/ga/scb",
                  data=json.dumps({"article_id": int(aid), "items": scb}).encode(),
                  headers={"X-GA-Token": tok, "Content-Type": "application/json"})
              try:
                  resp = json.loads(urllib.request.urlopen(req, timeout=30).read())
                  print(f"色彩吧入库: 发 {len(scb)} 行 -> {resp}")
              except Exception as e:
                  print(f"色彩吧入库失败: {e}")
          else:
              print(f"色彩吧入库: 跳过(api/token缺失, scb={len(scb)})")
          PY
      - name: commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A experiments
          git commit -m "vision experiment ${{ inputs.aid }} ${{ inputs.start }}-${{ inputs.end }}" || echo "no change"
          git push || echo "push failed"
