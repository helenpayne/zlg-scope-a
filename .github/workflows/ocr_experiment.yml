name: vision-experiment

# 实验: 5 个 runner 并行, 各拉一段"追加料图"URL -> 下载 -> 图片直接交大模型判 直选/色彩吧/垃圾 -> CSV
# (不再使用 OCR; runner 内 VISION_CONCURRENCY 个 opencode 窗口并行)
on:
  workflow_dispatch:
    inputs:
      aid:
        description: 文章ID
        default: '2663478'
      start:
        description: 起始序号(1-based)
        default: '1'
      end:
        description: 结束序号(含)
        default: '100'
      shards:
        description: 并行 runner 数
        default: '5'
      vision_concurrency:
        description: 每个runner内 opencode 并行窗口数
        default: '5'
      vision_models:
        description: 模型(逗号分隔, 前为主后为备用)
        default: 'opencode/space-bunny-free,opencode/mimo-v2.6-flash-free'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          n = int("${{ inputs.shards }}")
          print("matrix=" + json.dumps(list(range(n))))
          PY

  shard:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      API_BASE: ${{ secrets.API_BASE }}
      API_TOKEN: ${{ secrets.API_TOKEN }}
      AID: ${{ inputs.aid }}
      START: ${{ inputs.start }}
      END: ${{ inputs.end }}
      SHARD: ${{ matrix.shard }}
      SHARDS: ${{ inputs.shards }}
      VISION_CONCURRENCY: ${{ inputs.vision_concurrency }}
      VISION_MODELS: ${{ inputs.vision_models }}
      OUT_DIR: out
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: deps
        run: |
          npm install -g opencode-ai 2>&1 | tail -1
          opencode --version 2>&1 | head -1
      - name: run shard
        run: python .github/scripts/vision_shard.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-${{ matrix.shard }}
          path: out/

  combine:
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: all
          merge-multiple: true
      - name: merge csv (清空旧 csv, 保存图片)
        env:
          AID: ${{ inputs.aid }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
        run: |
          mkdir -p experiments/images
          rm -f experiments/*.csv
          cp -n all/images/* experiments/images/ 2>/dev/null || true
          python3 - <<'PY'
          import csv, glob, os
          rows = []
          for f in sorted(glob.glob("all/shard_*.csv")):
              with open(f, newline="", encoding="utf-8") as fh:
                  rows += list(csv.DictReader(fh))
          rows.sort(key=lambda r: int(r["idx"]))
          out = f"experiments/vision_{os.environ['AID']}_{os.environ['START']}_{os.environ['END']}.csv"
          with open(out, "w", newline="", encoding="utf-8") as fh:
              w = csv.DictWriter(fh, fieldnames=list(rows[0].keys()))
              w.writeheader(); w.writerows(rows)
          j = sum(1 for r in rows if r["junk"] == "true")
          print(f"{out}: {len(rows)} imgs, junk={j}, "
                f"直选={sum(1 for r in rows if r['kind']=='直选')}, "
                f"色彩吧={sum(1 for r in rows if r['kind']=='色彩吧')}")
          PY
      - name: commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A experiments
          git commit -m "vision experiment ${{ inputs.aid }} ${{ inputs.start }}-${{ inputs.end }}" || echo "no change"
          git push || echo "push failed"
